# Infraestrutura como código no Render (Blueprint): os dois ambientes da API.
#
# Criação (uma vez): Render Dashboard > New > Blueprint > repositório orbital-sos-api.
# - Jwt__Key é gerada pelo próprio Render (generateValue), ninguém vê o valor.
# - Variáveis com "sync: false" são pedidas no painel na criação e nunca ficam no Git.
# - Banco: PostgreSQL no Supabase; cada ambiente usa o próprio schema e usuário (Database__Schema).
#
# O deploy de cada versão é feito pelo GitHub Actions (.github/workflows/ci-cd.yml),
# que chama o deploy hook do serviço com a imagem ghcr.io/...:<sha-do-commit>.
services:
  - type: web
    name: orbital-sos-api-staging
    runtime: image
    image:
      url: ghcr.io/vsilva1997/orbital-sos-api:develop
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: PORT
        value: "8080"
      - key: Database__Schema
        value: staging
      - key: Jwt__Key
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false

  - type: web
    name: orbital-sos-api-prod
    runtime: image
    image:
      url: ghcr.io/vsilva1997/orbital-sos-api:main
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: Database__Schema
        value: production
      - key: Jwt__Key
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
